version: '3.8'

services:
  node-app:
    build: 
      context: .
      dockerfile: Dockerfile

    container_name: app

    volumes:
      - ../..:/workspaces:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    networks: 
      - keycloak-dbs-brokers_backend_network

    ports:
      - "8000:8000" # For API. Overrides default command so things don't shut down after the process ends.
      - "8080:8080" # For UI. Overrides default command so things don't shut down after the process ends.

    user: root

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally. 
    # (Adding the "ports" property to this file will not forward from a Codespace.)